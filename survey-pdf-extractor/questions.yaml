# =============================================================================
# アンケート設問定義ファイル
# =============================================================================
# ここを書き換えるだけで、抽出スキーマ・Excel の列・集計方法がすべて変わります。
# Python コードを触る必要はありません。
#
# ★★★ 下の questions: は「サンプル（要件定義書 §3 の例）」です。
#     実際の設問に必ず差し替えてください。 ★★★
# =============================================================================

meta:
  survey_name: "CRA/EU規制 対応状況アンケート"

  # 1名あたりのページ数。全員分が1つの PDF になっている場合の分割単位に使う。
  pages_per_respondent: 6

  # 入力 PDF の構成
  #   auto          : 自動判定（ファイルが1つでページ数が pages_per_respondent より
  #                   十分多ければ「全員1ファイル」とみなして分割する）
  #   per_respondent: 1ファイル = 1名（ファイル名が回答者IDになる）
  #   single_file   : 全員が1ファイル（pages_per_respondent ごとに分割する）
  layout: auto

model:
  # モデル文字列（2026-09 時点の最新 Sonnet 系）
  name: claude-sonnet-5
  max_tokens: 16000

  # thinking: disabled | adaptive
  #   disabled … 追加の推論トークンを使わない（既定・最も安定＆安価）
  #   adaptive … 判読が難しい手書きが多い場合はこちらを試す
  thinking: disabled

  # 推論の深さ。thinking: adaptive のときだけ意味を持つ。
  #   low | medium | high | xhigh | max（null なら送信しない）
  effort: null

  # temperature は Claude Sonnet 5 / Opus 5 など最新世代では
  # 廃止されており、送ると 400 エラーになります（README 参照）。
  # 旧世代モデル（例: claude-sonnet-4-5）を使う場合のみ 0 を指定してください。
  temperature: null

  # tool の input_schema を strict モードで強制するか。
  # モデルが strict 未対応の場合は自動で strict なしにフォールバックします。
  strict_tools: true

  # PDF をそのまま送るか、画像に変換して送るかの閾値・設定
  pdf_max_bytes: 20000000   # これを超える PDF は最初から画像フォールバック
  image_dpi: 300            # 画像フォールバック時の解像度

# -----------------------------------------------------------------------------
# 設問定義
# -----------------------------------------------------------------------------
# id      : 設問ID（Excel の列名・JSON のキーになる。重複不可）
# type    : single_choice | multi_choice | free_text | number
# text    : 設問文（プロンプトと Excel ヘッダに使われる）
# choices : single_choice / multi_choice のときは必須
# unit    : number のときの単位（任意・プロンプトのヒントになる）
# note    : 読み取り時の注意書き（任意・プロンプトにそのまま渡される）
# -----------------------------------------------------------------------------
questions:
  - id: Q1
    type: single_choice
    text: 貴社の業種は？
    choices: [製造業, 商社, その他]

  - id: Q2
    type: single_choice
    text: CRA対応の進捗状況
    choices: [未着手, 検討中, 着手済, 完了]

  - id: Q3
    type: multi_choice
    text: 関心のある規制
    choices: [CRA, NIS2, JC-STAR, EU Data Act]

  - id: Q4
    type: free_text
    text: 現在の課題
    note: 手書きの自由記述。要約せず、読み取れたまま raw_text に入れること。

  - id: Q5
    type: number
    text: 対象製品数
    unit: 製品
