# =============================================================================
# CRA 自己宣言ワークショップ アンケート 設問定義
# =============================================================================
# 2026-08-26 実施「CRA 自己宣言ワークショップ」アンケート用紙（全6ページ、
# 1ページ目は表紙のご挨拶）に合わせて定義。
# ここを書き換えるだけで、抽出スキーマ・Excel の列・集計方法がすべて変わります。
# =============================================================================

meta:
  survey_name: "CRA 自己宣言ワークショップ アンケート"

  # 1名あたりのページ数（表紙1ページ＋設問5ページ = 6）
  pages_per_respondent: 6

  # auto | per_respondent | single_file | by_page_marker
  #   by_page_marker … 用紙の右上に手書きされた回答者番号でページをグループ化する。
  #                    ページ抜け・順番違いがあっても回答者がずれないので、
  #                    全員分が1ファイルに入っている場合はこれを推奨。
  layout: by_page_marker

  # 手書き番号の位置（ページ幅・高さに対する割合で x0, y0, x1, y1）
  # 既定は「右上の隅」。この範囲だけを切り出して読むので追加コストはごくわずか。
  marker_region: [0.62, 0.0, 1.0, 0.14]

  # by_page_marker で作る回答者IDの接頭辞（番号1 → No01）
  respondent_id_prefix: "No"

  # 5段階評価がすべて最低値（1）で、かつ自由記述が書かれている回答者を
  # 「尺度の向きを取り違えた可能性あり」として要確認シートに出す
  flag_uniform_min_ratings: true

model:
  name: claude-sonnet-5
  max_tokens: 16000
  thinking: disabled
  effort: null
  temperature: null            # Sonnet 5 では送れない（README 参照）
  strict_tools: true
  pdf_max_bytes: 20000000
  image_dpi: 300

# 5段階評価のラベル（全設問で共通なので YAML のアンカーで使い回す）
x-scale5: &scale5
  1: 非常に不満足
  2: やや不満足
  3: どちらともいえない
  4: やや満足
  5: 非常に満足

# -----------------------------------------------------------------------------
# 設問定義
#   type: single_choice | multi_choice | free_text | number | rating
#   rating は scale（[最小, 最大]）と labels を持ち、
#   「丸が付いた数字」を数値として抽出 → 平均・中央値・段階別件数を集計する
# -----------------------------------------------------------------------------
questions:

  # === 1 基本情報（2ページ目）===============================================
  - id: Q1_1
    type: free_text
    text: 所属部署
    note: 部署名の略称・アルファベット表記が多い。読めたまま記入すること。

  - id: Q1_2
    type: free_text
    text: 役職／職位
    note: 「なし」と書かれている場合はその文字列をそのまま value に入れる（未記入ではない）。

  - id: Q1_3
    type: single_choice
    text: CRA自己宣言の経験
    choices: [今回が初めて, 過去に1回, 過去に複数回]
    note: チェックボックス（□）にレ点。1つだけ選ぶ設問。

  # === 2 ワークショップ全体の評価（2〜3ページ目）=============================
  - id: Q2_1
    type: rating
    text: ワークショップ全体の満足度
    scale: [1, 5]
    labels: *scale5

  - id: Q2_2
    type: rating
    text: ワークショップの目的・内容は分かりやすかったですか
    scale: [1, 5]
    labels: *scale5

  - id: Q2_3
    type: rating
    text: 時間配分は適切でしたか
    scale: [1, 5]
    labels: *scale5

  - id: Q2_4
    type: rating
    text: ファシリテーション（進行・説明）に満足していますか
    scale: [1, 5]
    labels: *scale5

  # === 3 理解度・学び（3ページ目）===========================================
  - id: Q3_1
    type: rating
    text: CRA自己宣言の目的について理解できましたか
    scale: [1, 5]
    labels: *scale5

  - id: Q3_2
    type: rating
    text: CRA自己宣言の進め方（プロセス）について理解できましたか
    scale: [1, 5]
    labels: *scale5

  - id: Q3_3
    type: rating
    text: CRA自己宣言が自分の業務に与える影響や意義をイメージできましたか
    scale: [1, 5]
    labels: *scale5

  - id: Q3_4
    type: free_text
    text: ワークショップを通じて新たに気づいた点や学び（自由記述）

  # === 4 実践への意欲・不安（4ページ目）======================================
  - id: Q4_1
    type: rating
    text: ワークショップ参加後、CRA自己宣言を実施してみようと思えますか
    scale: [1, 5]
    labels: *scale5

  - id: Q4_2
    type: free_text
    text: CRA自己宣言の実施にあたり、現時点での不安や懸念（自由記述）

  - id: Q4_3
    type: free_text
    text: CRA自己宣言の実施を円滑に進めるために、会社／組織に期待するサポート（自由記述）

  # === 5 コンテンツ・資料への評価（4〜5ページ目）=============================
  - id: Q5_1
    type: rating
    text: 説明資料（スライド・配布物）は分かりやすかったですか
    scale: [1, 5]
    labels: *scale5

  - id: Q5_2
    type: rating
    text: 関連知識の紹介（サイバーセキュリティ全般）は参考になりましたか
    scale: [1, 5]
    labels: *scale5

  - id: Q5_3
    type: free_text
    text: 今後、追加してほしいテーマや事例（自由記述）

  # === 6 ワークショップの進め方について（5ページ目）===========================
  - id: Q6_1
    type: rating
    text: 講義の速さは適切でしたか
    scale: [1, 5]
    labels: *scale5

  - id: Q6_2
    type: rating
    text: グループディスカッションは有意義でしたか
    scale: [1, 5]
    labels: *scale5

  - id: Q6_3
    type: rating
    text: 発言しやすい雰囲気でしたか
    scale: [1, 5]
    labels: *scale5

  - id: Q6_4
    type: free_text
    text: 進行方法について、良かった点・改善してほしい点（自由記述）

  # === 7 今後への要望（6ページ目）===========================================
  - id: Q7_1
    type: free_text
    text: CRA自己宣言に関するフォロー研修・説明会で希望する内容（自由記述）

  - id: Q7_2
    type: rating
    text: 今回のワークショップを他の同僚に勧めたいと思いますか
    scale: [1, 5]
    labels: *scale5

  - id: Q7_3
    type: free_text
    text: その他、ご意見・ご要望（自由記述）
